<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/emblem-placeholder.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official portal of Bhopal Municipal Corporation (BMC) and MPPCB for monitoring idol immersion water quality across Bhopal ghats, NGT immersion directives, and eco-friendly visarjan slot registration." />
    <meta name="keywords" content="Bhopal, Ghat Watch, Visarjan 2026, CPCB Class B, MPPCB, NGT Lake Immersion, Water Quality, Durga Visarjan, Ganesh Visarjan" />
    <meta name="author" content="Bhopal Municipal Corporation & MPPCB" />
    <meta name="theme-color" content="#081F3E" />
    
    <!-- Google Fonts: Instrument Serif, Inter, Plus Jakarta Sans (Latin) + Noto Sans Devanagari (Hindi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Detection Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('ghatwatch_theme') || 'system';
          var isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <title>Ghat Watch | Bhopal Visarjan Water Quality Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
